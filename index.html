<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서로서가</title>
<meta name="description" content="독서모임 구성원끼리 책을 등록하고 서로 빌려주는 공유 서재">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="서로서가">

<!-- 링크 공유 시 카카오톡/문자/SNS 등에서 보이는 미리보기 카드 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="서로서가">
<meta property="og:title" content="서로서가 — 우리가 함께 만드는 작은 서재">
<meta property="og:description" content="각자의 책장 속에 잠들어 있던 책들이 모이면 작은 서재가 됩니다">
<meta property="og:image" content="https://seoro-seoga.vercel.app/og-image.png">
<meta property="og:url" content="https://seoro-seoga.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="서로서가 — 우리가 함께 만드는 작은 서재">
<meta name="twitter:description" content="각자의 책장 속에 잠들어 있던 책들이 모이면 작은 서재가 됩니다">
<meta name="twitter:image" content="https://seoro-seoga.vercel.app/og-image.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">

<!-- Firebase (compat SDK — same collection/doc/onSnapshot API shape used below) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
  :root {
    color-scheme: light;
    --bg: #f5f2ea;
    --paper: #ffffff;
    --paper-soft: #fffdf9;
    --ink: #241f18;
    --ink-soft: #6b6154;
    --ink-faint: #a89d8c;
    --line: #ece6d8;
    --line-strong: #ddd4bf;

    --terracotta: #c9603b;
    --terracotta-deep: #9c4a2c;
    --teal: #2e9e86;
    --teal-deep: #1f6a5a;
    --gold: #f6c34c;
    --gold-deep: #93701f;

    --shadow-card: 0 1px 2px rgba(36, 31, 24, 0.04), 0 8px 18px -12px rgba(36, 31, 24, 0.2);
    --shadow-pop: 0 20px 44px -16px rgba(36, 31, 24, 0.28);
    --radius: 16px;
    --radius-sm: 10px;

    /* 홈 화면에 추가해 앱처럼 실행할 때(standalone), 노치/상태바 영역을
       가리지 않도록 iOS 안전영역만큼 여백을 더해줘요. 브라우저 탭으로
       열었을 땐 0이라 평소와 똑같이 보여요. */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  img { max-width: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 15.5px;
    line-height: 1.5;
    padding-inline: 20px;
    padding-top: calc(var(--safe-t) + 22px);
    padding-bottom: calc(var(--safe-b) + 64px);
  }

  h1, h2, h3 { margin: 0; text-wrap: balance; }
  #app { max-width: 1040px; margin: 0 auto; }

  /* ---------- landing ---------- */
  #landing {
    margin-top: calc(-1 * (var(--safe-t) + 22px));
    margin-inline: -20px;
    margin-bottom: calc(-1 * (var(--safe-b) + 64px));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px);
    background: var(--bg);
  }
  .landing-inner { max-width: 320px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
  .landing-mark { display: block; width: 72px; height: 60px; }
  .landing-mark svg { display: block; width: 100%; height: 100%; }
  .landing-word { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); }
  .landing-tag { font-size: 0.98rem; font-weight: 500; line-height: 1.6; color: var(--ink); text-wrap: balance; }
  .landing-sub { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.7; max-width: 300px; }
  .landing-cta {
    margin-top: 6px; width: 100%; max-width: 260px;
    background: var(--teal-deep); color: var(--paper-soft);
    font: inherit; font-weight: 700; font-size: 0.92rem;
    padding: 14px; border: none; border-radius: 12px; cursor: pointer;
  }
  .landing-cta:hover { background: var(--teal); }
  .landing-meta { font-size: 0.76rem; color: var(--ink-faint); margin-top: 2px; }

  /* ---------- masthead ---------- */
  .masthead { padding-bottom: 18px; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand-left { display: flex; align-items: center; gap: 12px; }
  .brand-mark svg { display: block; width: 58px; height: auto; }
  .brand-name { font-weight: 800; font-size: 1.9rem; letter-spacing: -0.01em; color: var(--ink); }
  .brand-tag {
    margin-top: 3px;
    color: var(--ink-soft);
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    font-weight: 600;
  }
  .whoami { text-align: right; font-size: 0.84rem; color: var(--ink-soft); max-width: 220px; }
  .whoami strong { color: var(--ink); font-weight: 700; }
  .whoami button {
    margin-top: 3px;
    background: none;
    border: none;
    color: var(--terracotta-deep);
    text-decoration: underline;
    cursor: pointer;
    font: inherit;
    padding: 2px 0;
  }
  .whoami .whoami-name {
    background: none;
    border: none;
    color: inherit;
    text-decoration: none;
    font: inherit;
    cursor: pointer;
    padding: 2px 0;
  }
  .whoami-quote {
    margin-top: 4px;
    font-size: 0.76rem;
    font-style: italic;
    color: var(--ink-faint);
    line-height: 1.5;
  }
  .masthead-rule-thin { height: 1px; background: var(--line-strong); margin-top: 16px; }

  /* ---------- issue line (stats) ---------- */
  .issue-line {
    font-size: 0.82rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 18px 0 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .issue-line::-webkit-scrollbar { display: none; }
  .issue-line b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .issue-line .sep { margin: 0 10px; color: var(--line-strong); flex: none; }

  /* ---------- layout: vertical index + content ---------- */
  .layout { display: flex; gap: 22px; align-items: flex-start; }
  .idx-nav {
    flex: none;
    width: 108px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding-top: 2px;
    position: sticky;
    top: 20px;
    align-self: flex-start;
  }
  .idx-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    text-align: left;
    font: inherit;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-radius: 11px;
    padding: 11px 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .idx-item:hover { background: var(--bg); }
  .idx-item.is-active { background: #f4e2d8; color: var(--terracotta-deep); }
  .idx-count {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .idx-item.is-active .idx-count { color: var(--terracotta-deep); }
  #main { flex: 1; min-width: 0; }

  /* lightweight "page turn" feel when switching sections (tap or swipe) */
  @keyframes page-slide-in {
    from { opacity: 0; transform: translateX(16px) rotateZ(1deg); }
    to { opacity: 1; transform: translateX(0) rotateZ(0deg); }
  }
  @keyframes page-slide-in-rev {
    from { opacity: 0; transform: translateX(-16px) rotateZ(-1deg); }
    to { opacity: 1; transform: translateX(0) rotateZ(0deg); }
  }
  .page-anim-fwd { animation: page-slide-in 0.26s ease-out both; }
  .page-anim-rev { animation: page-slide-in-rev 0.26s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .page-anim-fwd, .page-anim-rev { animation: none; }
  }

  .idx-item:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--terracotta);
    outline-offset: 2px;
  }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font: inherit;
    font-weight: 600;
    font-size: 0.8rem;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip.is-active { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }

  /* ---------- book grid & cards ---------- */
  .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  #all-grid.book-grid { gap: 8px; }

  .book-card {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }

  .genre-chip {
    align-self: flex-start;
    font-weight: 700;
    font-size: 0.64rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-deep);
  }

  .book-title { font-weight: 700; font-size: 1.05rem; line-height: 1.4; color: var(--ink); }
  .new-badge {
    display: inline-block;
    font-size: 0.58rem;
    font-weight: 700;
    color: var(--terracotta);
    border: 1px solid var(--terracotta);
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: middle;
    transform: translateY(-2px);
    letter-spacing: 0.03em;
  }
  .book-meta { font-size: 0.84rem; color: var(--ink-soft); }
  .book-note {
    font-size: 0.82rem;
    color: var(--ink-soft);
    background: var(--bg);
    border-radius: 8px;
    padding: 6px 10px;
    font-style: italic;
  }
  .status-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .pill { font-size: 0.74rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; letter-spacing: 0.01em; }
  .pill.st-available { background: #eaf3ef; color: var(--teal-deep); }
  .pill.st-borrowed { background: var(--bg); color: var(--ink-soft); }

  .stamp {
    font-size: 0.72rem;
    font-weight: 600;
    background: transparent;
    color: var(--ink-soft);
    border: 1px dashed var(--line-strong);
    border-radius: 999px;
    padding: 3px 10px;
    font-variant-numeric: tabular-nums;
  }
  .stamp.is-overdue { background: var(--terracotta); color: #fff; border-color: var(--terracotta); }

  .borrower-line { font-size: 0.82rem; color: var(--ink-soft); }
  .want-line { font-size: 0.78rem; color: var(--ink-faint); display: flex; align-items: center; gap: 4px; }
  .want-line b { color: var(--gold-deep); font-weight: 700; }
  .want-line svg { color: var(--gold); flex: none; }

  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-weight: 700;
    font-size: 0.8rem;
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink-soft);
    line-height: 1.1;
  }
  .btn:hover { border-color: var(--terracotta); color: var(--terracotta); }
  .btn.primary { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }
  .btn.primary:hover { background: var(--terracotta-deep); border-color: var(--terracotta-deep); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--terracotta); border-color: var(--terracotta); background: transparent; }
  .btn.want { color: var(--ink-soft); }
  .btn.want svg { color: var(--gold); }
  .btn.want.is-on { background: #fbf1da; border-color: var(--gold); color: var(--gold-deep); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- compact card (전체 탭: 둘러보기 전용, 더 많이 보이게) ---------- */
  .book-card.is-compact .card-body { padding: 11px 13px; gap: 3px; }
  .book-card.is-compact .book-title { font-size: 0.94rem; }
  .book-card.is-compact .book-meta { font-size: 0.78rem; }
  .book-card.is-compact .genre-chip { font-size: 0.6rem; }
  .book-card.is-compact .book-note.is-clamp {
    background: none;
    padding: 0;
    font-style: normal;
    font-size: 0.78rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .book-card.is-compact .status-row { margin-top: 0; gap: 6px; }
  .book-card.is-compact .pill { font-size: 0.68rem; padding: 3px 9px; }
  .book-card.is-compact .stamp { font-size: 0.66rem; padding: 2px 8px; }
  .book-card.is-compact .want-line { font-size: 0.72rem; }
  .book-card.is-compact .card-actions { gap: 6px; padding-top: 5px; }
  .book-card.is-compact .btn { padding: 6px 11px; font-size: 0.74rem; }

  .inline-form {
    margin-top: 4px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .inline-form label { font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); }
  .inline-form input[type="date"] {
    font: inherit;
    font-size: 0.85rem;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    padding: 44px 16px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    grid-column: 1 / -1;
  }
  .empty-state p:first-child { font-weight: 700; font-size: 1rem; color: var(--ink); margin-bottom: 6px; }

  /* ---------- my shelf form ---------- */
  .panel {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-card);
  }
  .panel h2 { font-size: 1.02rem; font-weight: 700; margin-bottom: 14px; color: var(--ink); }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.span-2 { grid-column: 1 / -1; }
  .field label { font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); }
  .field input, .field textarea, .field select {
    font: inherit;
    font-size: 0.9rem;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
    width: 100%;
  }
  .field textarea { resize: vertical; min-height: 52px; }
  .field select { appearance: auto; }
  .panel-actions { display: flex; gap: 8px; margin-top: 14px; }
  @media (max-width: 480px) { .field-grid { grid-template-columns: 1fr; } }

  .section-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .section-heading h2 { font-size: 1.15rem; font-weight: 700; color: var(--ink); }

  /* ---------- activity ---------- */
  .activity-list { display: flex; flex-direction: column; border-radius: var(--radius); overflow: hidden; background: var(--paper); box-shadow: var(--shadow-card); }
  .activity-row { display: flex; justify-content: space-between; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
  .activity-row:last-child { border-bottom: none; }
  .activity-time { font-size: 0.72rem; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- identity modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(36, 31, 24, 0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-card {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow-pop);
    padding: 28px;
    max-width: 400px;
    width: 100%;
  }
  .modal-card h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; color: var(--ink); }
  .modal-card p { color: var(--ink-soft); font-size: 0.87rem; margin-bottom: 16px; }
  .modal-card input {
    font: inherit;
    font-size: 0.95rem;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
    margin-bottom: 12px;
  }
  .member-chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .member-chip-wrap {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--bg);
    padding-right: 4px;
  }
  .member-chip {
    font: inherit;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 6px 6px 6px 12px;
    border-radius: 999px 0 0 999px;
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .member-chip:hover { color: var(--terracotta); }
  .member-chip-del {
    font: inherit;
    font-size: 0.78rem;
    line-height: 1;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .member-chip-del:hover { background: var(--terracotta); color: #fff; }

  .banner {
    background: #f7e9e1;
    color: var(--terracotta-deep);
    border: 1px solid var(--terracotta);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 18px;
  }

  .loading-note { color: var(--ink-faint); font-size: 0.88rem; padding: 24px 0; text-align: center; }

  footer.credit {
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 40px;
  }

  @media (max-width: 520px) {
    .brand-name { font-size: 1.5rem; }
    .brand-mark svg { width: 44px; height: auto; }
    .whoami { text-align: left; max-width: none; }
    .brand { flex-direction: column; align-items: flex-start; }
    .layout { gap: 14px; }
    .idx-nav { width: 84px; }
    .idx-item { font-size: 0.82rem; padding: 10px 9px; }
    .idx-count { display: none; }
    .issue-line { font-size: 0.74rem; }
    .issue-line .sep { margin: 0 6px; }
  }
</style>
</head>
<body>

<div id="landing">
  <div class="landing-inner">
    <span class="landing-mark" id="landing-mark"></span>
    <div class="landing-word">서로서가</div>
    <div class="landing-tag">우리가 함께 만드는 작은 서재</div>
    <p class="landing-sub"><span style="white-space: nowrap;">각자의 책장 속에 잠들어 있던 책들이</span><br>모이면 작은 서재가 됩니다</p>
    <button class="landing-cta" type="button" id="landing-cta">서재 문열기</button>
    <p class="landing-meta">이름만 알려주시면 바로 시작할 수 있어요</p>
  </div>
</div>

<div id="app" hidden>
  <div class="masthead">
    <div class="brand">
      <div class="brand-left">

<script>
(function () {
  "use strict";

  // ---------- Firebase project config ----------
  // Firebase 콘솔 > 프로젝트 설정 > "내 앱" 에서 웹 앱을 추가하면 나오는 값을
  // 그대로 여기에 붙여넣으세요. (README-DEPLOY.md에 단계별 안내가 있어요.)
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAYdCUnHpbFZ0zzEmrxe0CE1YO-D08G61s",
    authDomain: "seoro-seoga.firebaseapp.com",
    projectId: "seoro-seoga",
    storageBucket: "seoro-seoga.firebasestorage.app",
    messagingSenderId: "489636423096",
    appId: "1:489636423096:web:34cebaad928911ab749b4d"
  };

  // 4개의 책이 서로 기대어 선 모습 — 왼쪽 세 권은 오른쪽으로, 마지막 한 권은
  // 왼쪽으로 살짝 기울어 서 있는 최종 확정 로고 (한날 팔레트 계승).
  var LOGO_SVG =
    '<svg viewBox="0 0 128 100" aria-hidden="true" focusable="false">' +
    '<rect x="12" y="18" width="15" height="64" rx="6" fill="#F2703E" transform="rotate(12 19.5 82)"></rect>' +
    '<rect x="29" y="18" width="15" height="64" rx="6" fill="#F6C34C" transform="rotate(12 36.5 82)"></rect>' +
    '<rect x="46" y="18" width="15" height="64" rx="6" fill="#2E9E86" transform="rotate(12 53.5 82)"></rect>' +
    '<rect x="75" y="34" width="15" height="48" rx="6" fill="#F2703E" transform="rotate(-14 82.5 82)"></rect>' +
    "</svg>";

  var HEART_OUTLINE = '<svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="7" cy="7.3" r="3.2"></circle><circle cx="13" cy="7.3" r="3.2"></circle><polygon points="3.4,9.4 16.6,9.4 10,16.3"></polygon></svg>';
  var HEART_FILLED = '<svg viewBox="0 0 20 20" width="13" height="13" fill="currentColor"><circle cx="7" cy="7.3" r="3.8"></circle><circle cx="13" cy="7.3" r="3.8"></circle><polygon points="3.2,9.3 16.8,9.3 10,16.6"></polygon></svg>';

  var GENRE_SUGGESTIONS = ["소설", "에세이", "인문", "자기계발", "시/문학", "과학", "역사", "경제/경영", "예술", "만화", "기타"];

  // 마스트헤드에 하루에 한 번씩 바뀌는 책/독서에 관한 짧은 문장을 보여줘요.
  // 최근 소설의 특정 번역판 문장을 그대로 가져오면 번역자 저작권 문제가 생길
  // 수 있어서, 저자가 뚜렷하고 오래 회자돼온 짧은 경구 위주로 골랐어요.
  var QUOTES = [
    "책은 우리 안의 얼어붙은 바다를 깨는 도끼여야 한다 — 프란츠 카프카",
    "한 권의 책을 읽음으로써 삶에서 새로운 시대를 본 사람이 있다 — 헨리 데이비드 소로",
    "책은 마음의 양식이다 — 소크라테스",
    "좋은 책을 읽는 것은 지난 세기의 가장 훌륭한 사람들과 대화를 나누는 것과 같다 — 르네 데카르트",
    "오늘의 나를 만든 것은 우리 마을의 도서관이었다 — 빌 게이츠",
    "책을 사랑하는 사람에게는 결코 외로운 밤이 없다 — 앤드류 랭",
    "독서는 정신에 있어서 운동과 같은 것이다 — 조지프 애디슨",
    "책이 없는 방은 영혼이 없는 육체와 같다 — 키케로",
    "많이 읽되, 많은 것을 읽지는 말라 — 플리니우스",
    "책 속에 길이 있다",
    "하루라도 책을 읽지 않으면 입 안에 가시가 돋는다 — 안중근",
    "책은 인류가 쌓아온 경험의 보고다",
    "가장 훌륭한 여행은 책 속에 있다",
    "한 권의 책, 한 자루의 펜, 한 명의 아이가 세상을 바꿀 수 있다 — 말랄라 유사프자이",
    "당신이 정말로 사랑하는 것의 이상한 이끌림에 조용히 끌려가십시오. 그것은 당신을 잘못된 길로 인도하지 않을 것입니다 — 루미",
    "상처는 빛이 들어오는 곳입니다 — 루미",
    "슬퍼하지 마세요. 당신이 잃은 것은 다른 형태로 돌아옵니다 — 루미",
    "너무 작게 행동하지 마세요. 당신은 황홀하게 움직이는 우주입니다 — 루미",
    "당신이 찾는 것이 당신을 찾고 있습니다 — 루미",
    "당신 안에 펼쳐지는 이야기에 만족하지 마세요. 당신만의 신화를 펼쳐보세요 — 루미",
    "당신은 날개를 가지고 태어났는데 왜 인생을 기어다니는 것을 선택합니까 — 루미"
  ];
  function quoteOfTheDay() {
    var day = Math.floor(Date.now() / 86400000);
    return QUOTES[day % QUOTES.length];
  }
  var TABS = [
    { id: "all", label: "전체", icon: "all" },
    { id: "mine", label: "내 서재", icon: "mine" },
    { id: "wish", label: "찜한 책", icon: "wish" },
    { id: "activity", label: "활동", icon: "activity" }
  ];

  var db = null;
  var me = null; // {id, name}
  var members = [];   // [{id, name}]
  var books = [];      // [{id, ...}]
  var activity = [];   // [{id, ...}]
  var dbReady = false;
  var dbFailed = false;

  var state = {
    tab: "all",
    statusFilter: "all", // all | available | borrowed
    borrowOpenFor: {},   // bookId -> default due date string
    editingBookId: null, // null | "new" | bookId
    formDraft: null
  };

  // ---------- utils ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function localDateStr(d) {
    d = d || new Date();
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function addDays(str, n) {
    var d = new Date(str + "T00:00:00");
    d.setDate(d.getDate() + n);
    return localDateStr(d);
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    var wd = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일(" + wd + ")";
  }
  function overdueDays(iso) {
    var today = new Date(localDateStr() + "T00:00:00");
    var due = new Date(iso + "T00:00:00");
    return Math.round((today - due) / 86400000);
  }
  function isOverdue(book) {
    return book.status === "borrowed" && book.dueDate && book.dueDate < localDateStr();
  }
  function timeAgo(ts) {
    var diff = Math.max(0, Date.now() - ts);
    var m = Math.floor(diff / 60000);
    if (m < 1) return "방금 전";
    if (m < 60) return m + "분 전";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "시간 전";
    var d = Math.floor(h / 24);
    return d + "일 전";
  }
  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  // preserve focus/scroll across full re-renders
  function withPreservedFocus(fn) {
    var active = document.activeElement;
    var activeId = active && active.id ? active.id : null;
    var selStart = null, selEnd = null;
    if (active && typeof active.selectionStart === "number") {
      selStart = active.selectionStart; selEnd = active.selectionEnd;
    }
    var scrollY = window.scrollY;
    fn();
    if (activeId) {
      var el = document.getElementById(activeId);
      if (el) {
        el.focus();
        if (selStart !== null && el.setSelectionRange) {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
    window.scrollTo(0, scrollY);
  }

  // ---------- identity ----------
  function loadLocalMember() {
    try {
      var raw = localStorage.getItem("seoroseoga_me");
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveLocalMember(m) {
    try { localStorage.setItem("seoroseoga_me", JSON.stringify(m)); } catch (e) {}
  }
  function clearLocalMember() {
    try { localStorage.removeItem("seoroseoga_me"); } catch (e) {}
  }

  var pendingIdentityAction = null;

  // Browsing 전체 서가 needs no identity at all. Only actions that must be
  // attributed to someone (registering a book, borrowing, wishing) ask for
  // a name — and only at the moment they're needed, not up front.
  function requireIdentity(action) {
    if (me) { action(); return; }
    pendingIdentityAction = action;
    showIdentityModal();
  }

  function showIdentityModal() {
    var modal = document.getElementById("identity-modal");
    modal.hidden = false;
    renderIdentityChips();
  }
  function hideIdentityModal() {
    document.getElementById("identity-modal").hidden = true;
  }

  function becomeMember(m) {
    me = m;
    saveLocalMember(m);
    hideIdentityModal();
    render();
    if (pendingIdentityAction) {
      var action = pendingIdentityAction;
      pendingIdentityAction = null;
      action();
    }
  }

  function handleNameSubmit() {
    var input = document.getElementById("name-input");
    var name = (input.value || "").trim();
    if (!name) { input.focus(); return; }
    // 대소문자/앞뒤 공백만 다른 같은 이름이 이미 있으면 새로 만들지 않고
    // 그 사람으로 바로 등록해요. (jayden / Jayden 처럼 중복 회원이 생기는 걸 방지)
    var normalized = name.toLowerCase();
    var existing = members.find(function (m) { return (m.name || "").trim().toLowerCase() === normalized; });
    if (existing) {
      becomeMember({ id: existing.id, name: existing.name });
      return;
    }
    var id = genId();
    var record = { id: id, name: name };
    if (db) {
      db.collection("members").doc(id).set({ name: name, createdAt: Date.now() }).catch(function () {});
    }
    becomeMember(record);
  }

  function switchIdentity() {
    clearLocalMember();
    me = null;
    pendingIdentityAction = null;
    showIdentityModal();
    render();
  }

  // ---------- activity log (best effort) ----------
  function logActivity(type, book) {
    if (!db || !me) return;
    db.collection("activity").add({
      type: type,
      bookTitle: book.title,
      actorName: me.name,
      ts: Date.now()
    }).catch(function () {});
  }

  // ---------- data actions ----------
  function addBook(data) {
    if (!db || !me) return;
    db.collection("books").add({
      ownerId: me.id,
      ownerName: me.name,
      title: data.title,
      author: data.author || "",
      genre: data.genre || "",
      note: data.note || "",
      status: "available",
      borrowerId: null,
      borrowerName: null,
      dueDate: null,
      lentAt: null,
      wantList: [],
      createdAt: Date.now()
    }).then(function () {
      logActivity("add", { title: data.title });
    }).catch(function () {});
  }
  function updateBook(id, patch) {
    if (!db) return;
    db.collection("books").doc(id).update(patch).catch(function () {});
  }
  function deleteBook(id) {
    if (!db) return;
    db.collection("books").doc(id).delete().catch(function () {});
  }
  function confirmBorrow(book, dueDate) {
    updateBook(book.id, {
      status: "borrowed",
      borrowerId: me.id,
      borrowerName: me.name,
      dueDate: dueDate,
      lentAt: Date.now(),
      wantList: (book.wantList || []).filter(function (w) { return w.id !== me.id; })
    });
    logActivity("borrow", book);
  }
  function returnBook(book) {
    updateBook(book.id, { status: "available", borrowerId: null, borrowerName: null, dueDate: null, lentAt: null });
    logActivity("return", book);
  }
  function toggleWant(book) {
    var list = book.wantList || [];
    var already = list.some(function (w) { return w.id === me.id; });
    var next = already ? list.filter(function (w) { return w.id !== me.id; }) : list.concat([{ id: me.id, name: me.name }]);
    updateBook(book.id, { wantList: next });
    if (!already) logActivity("want", book);
  }

  // ---------- rendering ----------
  function render() {
    withPreservedFocus(function () {
      document.getElementById("brand-mark").innerHTML = LOGO_SVG;
      var landingMark = document.getElementById("landing-mark");
      if (landingMark) landingMark.innerHTML = LOGO_SVG;
      renderWhoami();
      renderBanner();
      renderIssueLine();
      renderTabs();
      renderIdentityChips();
      renderAllView();
      renderMineView();
      renderWishView();
      renderActivityView();
    });
  }

  function renderIdentityChips() {
    if (!document.getElementById("identity-modal").hidden) {
      var list = document.getElementById("member-chip-list");
      list.innerHTML = members.map(function (m) {
        return '<span class="member-chip-wrap">' +
          '<button type="button" class="member-chip" data-pick-member="' + esc(m.id) + '">' + esc(m.name) + "</button>" +
          '<button type="button" class="member-chip-del" data-delete-member="' + esc(m.id) + '" title="이 등록 삭제" aria-label="' + esc(m.name) + ' 등록 삭제">×</button>' +
          "</span>";
      }).join("");
    }
  }

  function renderWhoami() {
    var el = document.getElementById("whoami");
    if (!me) {
      el.innerHTML = "둘러보는 중<br><button type=\"button\" id=\"set-identity\">이름 등록하기</button>";
      return;
    }
    // "다른 사람으로 전환"은 평소엔 거의 쓸 일이 없어서 눈에 띄는 링크 대신
    // 이름을 탭하면 뜨는 형태로 숨겨두고, 그 자리엔 오늘의 문장을 보여줘요.
    el.innerHTML =
      '<button type="button" class="whoami-name" id="switch-identity">회원 <strong>' + esc(me.name) + '</strong>님</button>' +
      '<p class="whoami-quote">' + esc(quoteOfTheDay()) + "</p>";
  }

  function renderBanner() {
    var el = document.getElementById("db-banner");
    el.innerHTML = dbFailed
      ? '<div class="banner">실시간 저장소에 연결하지 못했어요. 잠시 후 새로고침해 주세요. (계속되면 관리자에게 알려주세요)</div>'
      : "";
  }

  function renderIssueLine() {
    var el = document.getElementById("issue-line");
    if (!dbReady) { el.innerHTML = ""; return; }
    var borrowedCount = books.filter(function (b) { return b.status === "borrowed"; }).length;
    var availableCount = books.filter(function (b) { return b.status === "available"; }).length;
    el.innerHTML =
      "회원 <b>" + members.length + "</b>명" +
      '<span class="sep">·</span>등록 도서 <b>' + books.length + "</b>권" +
      '<span class="sep">·</span>대출 가능 <b>' + availableCount + "</b>권" +
      '<span class="sep">·</span>대출 중 <b>' + borrowedCount + "</b>권";
  }

  function tabCounts() {
    return {
      all: books.length,
      mine: me ? books.filter(function (b) { return b.ownerId === me.id; }).length : 0,
      wish: me ? books.filter(function (b) { return (b.wantList || []).some(function (w) { return w.id === me.id; }); }).length : 0,
      activity: activity.length
    };
  }

  function renderTabs() {
    var el = document.getElementById("tabs");
    var counts = tabCounts();
    el.innerHTML = TABS.map(function (t) {
      return '<button type="button" class="idx-item' + (state.tab === t.id ? " is-active" : "") + '" data-tab="' + t.id + '">' +
        '<span class="idx-label">' + t.label + '</span>' +
        '<span class="idx-count">' + counts[t.id] + '</span>' +
        '</button>';
    }).join("");
    TABS.forEach(function (t) {
      var section = document.getElementById("view-" + t.id);
      if (section) section.hidden = state.tab !== t.id;
    });
  }

  function tabIndex(tabId) {
    for (var i = 0; i < TABS.length; i++) if (TABS[i].id === tabId) return i;
    return -1;
  }

  function goToTab(tabId) {
    if (tabId === state.tab) return;
    var oldIdx = tabIndex(state.tab);
    var newIdx = tabIndex(tabId);
    state.tab = tabId;
    render();
    var section = document.getElementById("view-" + tabId);
    if (section) {
      section.classList.remove("page-anim-fwd", "page-anim-rev");
      void section.offsetWidth; // restart animation
      section.classList.add(newIdx > oldIdx ? "page-anim-fwd" : "page-anim-rev");
    }
  }

  function statusFilterChips() {
    var el = document.getElementById("status-filter");
    var opts = [["all", "전체"], ["available", "대출 가능"], ["borrowed", "대출 중"]];
    el.innerHTML = opts.map(function (o) {
      return '<button type="button" class="chip' + (state.statusFilter === o[0] ? " is-active" : "") + '" data-status-filter="' + o[0] + '">' + o[1] + "</button>";
    }).join("");
  }

  // compact: 전체 서가(둘러보기 전용) 탭에서 쓰는 축약형 카드. 여기선 등록/수정을
  // 하지 않으니 메모를 한 줄로 줄이고, 내 책이어도 수정·삭제 버튼은 숨겨서
  // (그건 "내 서재" 탭의 역할) 한 화면에 더 많은 책이 보이게 해요.
  function bookCardHTML(book, compact) {
    var isMine = !!me && book.ownerId === me.id;
    var isBorrowedByMe = !!me && book.borrowerId === me.id;
    var wantList = book.wantList || [];
    var wantedByMe = !!me && wantList.some(function (w) { return w.id === me.id; });
    var overdue = isOverdue(book);
    var isNew = Date.now() - (book.createdAt || 0) < 3 * 86400000;

    var statusPill = book.status === "available"
      ? '<span class="pill st-available">대출 가능</span>'
      : '<span class="pill st-borrowed">대출 중</span>';

    var stamp = "";
    if (book.status === "borrowed" && book.dueDate) {
      stamp = overdue
        ? '<span class="stamp is-overdue">연체 ' + overdueDays(book.dueDate) + '일째</span>'
        : '<span class="stamp">' + fmtDate(book.dueDate) + " 반납예정</span>";
    }

    var borrowerLine = (!compact && book.status === "borrowed")
      ? '<p class="borrower-line">대출자: ' + esc(book.borrowerName) + (isBorrowedByMe ? " (나)" : "") + "</p>"
      : "";

    var wantLine = "";
    if (wantList.length) {
      wantLine = compact
        ? '<p class="want-line">' + HEART_FILLED + " <b>" + wantList.length + "</b>"
        : '<p class="want-line">' + HEART_FILLED + " <b>" + wantList.length + "</b> · " + wantList.map(function (w) { return esc(w.name); }).join(", ") + "</p>";
      if (compact) wantLine += "</p>";
    }

    var heartIcon = wantedByMe ? HEART_FILLED : HEART_OUTLINE;
    var wantBtn = '<button type="button" class="btn want' + (wantedByMe ? " is-on" : "") + '" data-action="toggle-want" data-id="' + book.id + '">' + heartIcon + (wantedByMe ? "찜 해제" : "찜하기") + "</button>";

    var actions = "";
    if (isMine) {
      if (compact) {
        // 전체 탭에서는 관리 버튼 없이 상태만 보여주고, 편집은 "내 서재"에서.
        actions = "";
      } else {
        actions = '<button type="button" class="btn ghost" data-action="edit" data-id="' + book.id + '">수정</button>' +
          '<button type="button" class="btn danger" data-action="delete" data-id="' + book.id + '">삭제</button>';
        if (book.status === "borrowed") {
          actions += '<button type="button" class="btn" data-action="force-return" data-id="' + book.id + '">반납 처리</button>';
        }
      }
    } else if (book.status === "available") {
      actions = '<button type="button" class="btn primary" data-action="open-borrow" data-id="' + book.id + '">대출하기</button>' + wantBtn;
    } else if (isBorrowedByMe) {
      actions = '<button type="button" class="btn primary" data-action="return" data-id="' + book.id + '">반납하기</button>';
    } else {
      actions = wantBtn;
    }

    var inlineBorrowForm = "";
    if (state.borrowOpenFor.hasOwnProperty(book.id)) {
      var defaultDate = state.borrowOpenFor[book.id];
      inlineBorrowForm =
        '<div class="inline-form">' +
        '<label for="due-' + book.id + '">반납예정일</label>' +
        '<input type="date" id="due-' + book.id + '" value="' + defaultDate + '">' +
        '<button type="button" class="btn primary" data-action="confirm-borrow" data-id="' + book.id + '">확정</button>' +
        '<button type="button" class="btn ghost" data-action="cancel-borrow" data-id="' + book.id + '">취소</button>' +
        "</div>";
    }

    var noteHTML = "";
    if (book.note) {
      noteHTML = compact
        ? '<p class="book-note is-clamp">' + esc(book.note) + "</p>"
        : '<p class="book-note">' + esc(book.note) + "</p>";
    }

    return (
      '<article class="book-card' + (compact ? " is-compact" : "") + '">' +
      '<div class="card-body">' +
      '<span class="genre-chip">' + esc(book.genre || "미분류") + "</span>" +
      '<h3 class="book-title">' + esc(book.title) + (isNew ? '<span class="new-badge">NEW</span>' : "") + "</h3>" +
      '<p class="book-meta">' + esc(book.author || "저자 미상") + " · 소장: " + esc(book.ownerName) + (isMine ? " (나)" : "") + "</p>" +
      noteHTML +
      '<div class="status-row">' + statusPill + stamp + "</div>" +
      borrowerLine +
      wantLine +
      (actions ? '<div class="card-actions">' + actions + "</div>" : "") +
      inlineBorrowForm +
      "</div>" +
      "</article>"
    );
  }

  function renderAllView() {
    statusFilterChips();
    var grid = document.getElementById("all-grid");
    if (!dbReady) { grid.innerHTML = '<div class="loading-note">불러오는 중…</div>'; return; }
    var list = books.filter(function (b) {
      if (state.statusFilter !== "all" && b.status !== state.statusFilter) return false;
      return true;
    }).slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    if (!list.length) {
      grid.innerHTML = '<div class="empty-state"><p>표시할 책이 없어요</p><p>필터를 확인해 보세요</p></div>';
      return;
    }
    grid.innerHTML = list.map(function (b) { return bookCardHTML(b, true); }).join("");
  }

  function bookFormHTML() {
    if (state.editingBookId === null) {
      return '<button type="button" class="btn primary" data-action="open-add-form">+ 책 등록하기</button>';
    }
    var editing = state.editingBookId !== "new";
    var draft = state.formDraft || { title: "", author: "", genre: "", note: "" };
    return (
      "<h2>" + (editing ? "책 정보 수정" : "책 등록하기") + "</h2>" +
      '<div class="field-grid">' +
      '<div class="field"><label for="f-title">제목 *</label><input type="text" id="f-title" value="' + esc(draft.title) + '" placeholder="책 제목"></div>' +
      '<div class="field"><label for="f-author">저자</label><input type="text" id="f-author" value="' + esc(draft.author) + '" placeholder="지은이"></div>' +
      '<div class="field"><label for="f-genre">분류</label><input type="text" id="f-genre" list="genre-suggestions" value="' + esc(draft.genre) + '" placeholder="예: 소설"></div>' +
      '<div class="field span-2"><label for="f-note">메모 (상태, 소장 이유 등)</label><textarea id="f-note" placeholder="예: 밑줄 조금 있어요">' + esc(draft.note) + "</textarea></div>" +
      "</div>" +
      '<datalist id="genre-suggestions">' + GENRE_SUGGESTIONS.map(function (g) { return '<option value="' + esc(g) + '">'; }).join("") + "</datalist>" +
      '<div class="panel-actions">' +
      '<button type="button" class="btn primary" data-action="save-book">' + (editing ? "저장" : "등록") + "</button>" +
      '<button type="button" class="btn ghost" data-action="cancel-form">취소</button>' +
      "</div>"
    );
  }

  function renderMineView() {
    document.getElementById("book-form-panel").innerHTML = bookFormHTML();
    var grid = document.getElementById("mine-grid");
    if (!dbReady) { grid.innerHTML = '<div class="loading-note">불러오는 중…</div>'; return; }
    if (!me) {
      grid.innerHTML = '<div class="empty-state"><p>아직 등록한 책이 없어요</p><p>위에서 책을 등록하면 이름을 물어볼게요</p></div>';
      return;
    }
    var mine = books.filter(function (b) { return b.ownerId === me.id; })
      .slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    if (!mine.length) {
      grid.innerHTML = '<div class="empty-state"><p>아직 등록한 책이 없어요</p><p>위에서 첫 책을 등록해 보세요</p></div>';
      return;
    }
    grid.innerHTML = mine.map(function (b) { return bookCardHTML(b); }).join("");
  }

  function renderWishView() {
    var grid = document.getElementById("wish-grid");
    if (!dbReady) { grid.innerHTML = '<div class="loading-note">불러오는 중…</div>'; return; }
    if (!me) {
      grid.innerHTML = '<div class="empty-state"><p>찜한 책이 없어요</p><p>전체 서가에서 마음에 드는 책에 하트를 눌러보세요</p></div>';
      return;
    }
    var wished = books.filter(function (b) { return (b.wantList || []).some(function (w) { return w.id === me.id; }); })
      .slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    if (!wished.length) {
      grid.innerHTML = '<div class="empty-state"><p>찜한 책이 없어요</p><p>전체 서가에서 마음에 드는 책을 찜해보세요</p></div>';
      return;
    }
    grid.innerHTML = wished.map(function (b) { return bookCardHTML(b); }).join("");
  }

  var ACTIVITY_LABEL = {
    add: function (a) { return esc(a.actorName) + "님이 『" + esc(a.bookTitle) + "』 등록"; },
    borrow: function (a) { return esc(a.actorName) + "님이 『" + esc(a.bookTitle) + "』 대출 시작"; },
    return: function (a) { return esc(a.actorName) + "님이 『" + esc(a.bookTitle) + "』 반납 완료"; },
    want: function (a) { return esc(a.actorName) + "님이 『" + esc(a.bookTitle) + "』 찜함"; }
  };

  function renderActivityView() {
    var wrap = document.getElementById("activity-wrap");
    if (!dbReady) { wrap.innerHTML = '<div class="loading-note">불러오는 중…</div>'; return; }
    if (!activity.length) {
      wrap.innerHTML = '<div class="empty-state"><p>아직 활동이 없어요</p><p>책을 등록하거나 대출해보면 여기 기록돼요</p></div>';
      return;
    }
    wrap.innerHTML = '<div class="activity-list">' + activity.map(function (a) {
      var label = ACTIVITY_LABEL[a.type] ? ACTIVITY_LABEL[a.type](a) : esc(a.actorName) + "님의 활동";
      return '<div class="activity-row"><span>' + label + '</span><span class="activity-time">' + timeAgo(a.ts) + "</span></div>";
    }).join("") + "</div>";
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var landingCta = e.target.closest("#landing-cta");
    if (landingCta) {
      document.getElementById("landing").hidden = true;
      document.getElementById("app").hidden = false;
      window.scrollTo(0, 0);
      return;
    }

    var delMemberBtn = e.target.closest("[data-delete-member]");
    if (delMemberBtn) {
      var delId = delMemberBtn.getAttribute("data-delete-member");
      var delMember = members.find(function (x) { return x.id === delId; });
      var delLabel = delMember ? delMember.name : "이 등록";
      if (window.confirm('"' + delLabel + '" 등록을 목록에서 삭제할까요?\n(등록했던 책이나 활동 기록은 그대로 남아요)')) {
        if (db) db.collection("members").doc(delId).delete().catch(function () {});
      }
      return;
    }

    var pickBtn = e.target.closest("[data-pick-member]");
    if (pickBtn) {
      var id = pickBtn.getAttribute("data-pick-member");
      var m = members.find(function (x) { return x.id === id; });
      if (m) becomeMember({ id: m.id, name: m.name });
      return;
    }
    if (e.target.id === "name-submit") { handleNameSubmit(); return; }
    if (e.target.id === "switch-identity") { switchIdentity(); return; }
    if (e.target.id === "set-identity") { requireIdentity(function () {}); return; }

    var tabBtn = e.target.closest("[data-tab]");
    if (tabBtn) { goToTab(tabBtn.getAttribute("data-tab")); return; }

    var filterBtn = e.target.closest("[data-status-filter]");
    if (filterBtn) { state.statusFilter = filterBtn.getAttribute("data-status-filter"); render(); return; }

    var actionBtn = e.target.closest("[data-action]");
    if (!actionBtn) return;
    var action = actionBtn.getAttribute("data-action");
    var id = actionBtn.getAttribute("data-id");
    var book = id ? books.find(function (b) { return b.id === id; }) : null;

    if (action === "open-borrow") {
      requireIdentity(function () {
        var next = {};
        next[id] = addDays(localDateStr(), 14);
        state.borrowOpenFor = next;
        render();
      });
    } else if (action === "cancel-borrow") {
      delete state.borrowOpenFor[id];
      render();
    } else if (action === "confirm-borrow") {
      var input = document.getElementById("due-" + id);
      var due = input && input.value ? input.value : addDays(localDateStr(), 14);
      delete state.borrowOpenFor[id];
      if (book) confirmBorrow(book, due);
      render();
    } else if (action === "return") {
      if (book) returnBook(book);
    } else if (action === "force-return") {
      if (book) returnBook(book);
    } else if (action === "toggle-want") {
      if (book) requireIdentity(function () { toggleWant(book); });
    } else if (action === "delete") {
      if (book && window.confirm('"' + book.title + '"을(를) 서재에서 삭제할까요?')) deleteBook(id);
    } else if (action === "edit") {
      state.editingBookId = id;
      state.formDraft = book ? { title: book.title, author: book.author, genre: book.genre, note: book.note } : { title: "", author: "", genre: "", note: "" };
      render();
    } else if (action === "open-add-form") {
      requireIdentity(function () {
        state.editingBookId = "new";
        state.formDraft = { title: "", author: "", genre: "", note: "" };
        render();
      });
    } else if (action === "cancel-form") {
      state.editingBookId = null;
      state.formDraft = null;
      render();
    } else if (action === "save-book") {
      var titleEl = document.getElementById("f-title");
      var title = titleEl ? titleEl.value.trim() : "";
      if (!title) { titleEl.focus(); return; }
      var data = {
        title: title,
        author: (document.getElementById("f-author") || {}).value || "",
        genre: (document.getElementById("f-genre") || {}).value || "",
        note: (document.getElementById("f-note") || {}).value || ""
      };
      if (state.editingBookId === "new") {
        addBook(data);
      } else {
        updateBook(state.editingBookId, data);
      }
      state.editingBookId = null;
      state.formDraft = null;
      render();
    }
  });

  document.addEventListener("input", function (e) {
    // Keep the in-progress add/edit form synced to state so a re-render
    // triggered by another member's action (a live db update) never
    // wipes out text this person is mid-typing.
    if (state.formDraft) {
      var fieldMap = { "f-title": "title", "f-author": "author", "f-genre": "genre", "f-note": "note" };
      var key = fieldMap[e.target.id];
      if (key) state.formDraft[key] = e.target.value;
    }
    if (e.target.id && e.target.id.indexOf("due-") === 0) {
      var bookId = e.target.id.slice(4);
      if (state.borrowOpenFor.hasOwnProperty(bookId)) state.borrowOpenFor[bookId] = e.target.value;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "name-input") handleNameSubmit();
  });

  // swipe between sections like turning a page — only reacts to a clear,
  // mostly-horizontal gesture on release, so normal scrolling and taps
  // are never intercepted or blocked.
  var touchStart = null;
  document.addEventListener("touchstart", function (e) {
    if (!me || e.touches.length !== 1) { touchStart = null; return; }
    if (!document.getElementById("identity-modal").hidden) { touchStart = null; return; }
    if (e.target && typeof e.target.closest === "function" && e.target.closest("input, textarea, select, .modal-card")) { touchStart = null; return; }
    var t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    var idx = tabIndex(state.tab);
    var nextIdx = idx + (dx < 0 ? 1 : -1);
    if (nextIdx >= 0 && nextIdx < TABS.length) goToTab(TABS[nextIdx].id);
  }, { passive: true });

  // ---------- boot ----------
  // Firebase가 잠시 끊겼던 동안(예: 설정 오류) 로컬에만 이름을 저장해둔 채
  // 활동한 사람은 members 컬렉션에 실제 문서가 없을 수 있다. 최초 스냅샷에서
  // 그런 상태를 발견하면, 조용히 한 번 다시 등록해 회원 수 집계가 맞도록 한다.
  var memberSyncAttempted = false;
  function syncLocalMemberIfMissing() {
    if (!me || memberSyncAttempted) return;
    if (members.some(function (m) { return m.id === me.id; })) return;
    memberSyncAttempted = true;
    db.collection("members").doc(me.id).set({ name: me.name, createdAt: Date.now() })
      .catch(function () { memberSyncAttempted = false; });
  }

  function initSubscriptions() {
    db.collection("members").onSnapshot(function (snap) {
      members = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .sort(function (a, b) { return a.name.localeCompare(b.name, "ko"); });
      dbReady = true;
      syncLocalMemberIfMissing();
      render();
    }, function () { dbFailed = true; render(); });

    db.collection("books").onSnapshot(function (snap) {
      books = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function () { dbFailed = true; render(); });

    db.collection("activity").orderBy("ts", "desc").limit(8).onSnapshot(function (snap) {
      activity = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function () {});
  }

  function boot() {
    var local = loadLocalMember();
    if (local && local.id && local.name) {
      me = local;
    }
    render();

    if (typeof firebase === "undefined" || FIREBASE_CONFIG.apiKey === "YOUR_API_KEY") {
      // Firebase SDK가 로드되지 않았거나 FIREBASE_CONFIG를 아직 채우지 않은 상태.
      dbFailed = true;
      render();
      return;
    }

    try {
      firebase.initializeApp(FIREBASE_CONFIG);
    } catch (e) {
      // 이미 초기화된 경우(핫리로드 등) 무시
    }

    // 로그인 화면 없이, 각 방문자를 브라우저별로 조용히 구분만 해주는
    // 익명 인증. 계정을 만들 필요도, 화면에 뭔가 뜨는 일도 없어요.
    firebase.auth().signInAnonymously().then(function () {
      db = firebase.firestore();
      initSubscriptions();
    }).catch(function () {
      dbFailed = true;
      render();
    });
  }

  boot();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
